name: Oro CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: oro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orocommerce-piece:
    name: orocommerce piece
    runs-on: ubuntu-latest
    if: github.repository != 'activepieces/activepieces'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - name: Build, lint, test and check translations
        run: npx turbo run build lint test i18n:check --filter=@activepieces/piece-orocommerce
